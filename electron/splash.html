<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-muted: #888888;
      --text-subtle: #444444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .logo-wrapper {
      width: 100px;
      height: 100px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      background: #000000;
      display: block;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .progress-bar-container {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: #ffffff;
      border-radius: 999px;
      animation: progress-indeterminate 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      font-weight: 400;
      transition: opacity 0.3s ease;
    }

    @keyframes progress-indeterminate {
      0% { left: -35%; width: 35%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 35%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <img src="../logo/logo3.png" alt="Iris AI" class="logo-img" onerror="this.src='../build/icon.png'">
    </div>
    <h1>Iris AI</h1>
    <div class="tagline">Local Intelligence Desktop</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="statusMsg">Initializing AI Engine...</div>
  </div>

  <script>
    const statusMsg = document.getElementById('statusMsg');
    const messages = [
      "Initializing AI Engine...",
      "Starting local backend service...",
      "Loading configuration & models...",
      "Preparing UI workspace..."
    ];
    let msgIdx = 0;
    setInterval(() => {
      msgIdx = (msgIdx + 1) % messages.length;
      statusMsg.style.opacity = 0;
      setTimeout(() => {
        statusMsg.innerText = messages[msgIdx];
        statusMsg.style.opacity = 1;
      }, 200);
    }, 2200);
  </script>
</body>
</html>
